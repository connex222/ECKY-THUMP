name: Game tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check scripts/stage-party-csv.js
          node --check scripts/stage-more-cards.js
          node --check scripts/import-maureen-audio.js
          node --check server/durability.js
          node --check server/index.js
          node --check server/game.js
          node --check server/game-cards.js
          node --check server/telemetry.js
          node --check server/content.js
          node --check public/assets/app.js
          node --check public/assets/tv.js
      - name: Install audio tools for recorded-voice QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - run: npm test
      - name: Verify recorded compère manifest matches actual audio assets
        run: npm run audio:check
      - name: Content catalogue structural audit
        run: npm run audit:content
      - name: Approved Social Club card catalogue audit
        run: npm run audit:approved-content
      - name: Verify original CSV provenance for approved additional cards
        run: npm run audit:more-cards
      - name: Editorial review queue (non-approving)
        run: npm run review:content
      - name: Repeatable Game Card simulation smoke test
        run: npm run simulate:smoke
