name: Game tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check server/index.js
          node --check server/game.js
          node --check server/game-cards.js
          node --check server/telemetry.js
          node --check server/content.js
          node --check public/assets/app.js
          node --check public/assets/tv.js
      - run: npm test
      - name: Content catalogue structural audit
        run: npm run audit:content
      - name: Validate unapproved Social Club editorial Batch 01
        run: npm run audit:premium-batch
      - name: Editorial review queue (non-approving)
        run: npm run review:content
      - name: Repeatable Game Card simulation smoke test
        run: npm run simulate:smoke
